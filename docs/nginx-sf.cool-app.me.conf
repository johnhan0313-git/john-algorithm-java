# sf.cool-app.me — John Algorithm（片段，合入 ~/mydocker/mntdata/nginx/nginx.conf）
# compose 已将 backend/frontend 加入 john-nginx_default

    server {
        listen 80;
        server_name sf.cool-app.me;

        client_max_body_size 20m;

        location /api/ {
            set $algo_backend http://john-algorithm-java-backend-1:8004;
            proxy_pass $algo_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        location / {
            set $algo_frontend http://john-algorithm-java-frontend-1:80;
            proxy_pass $algo_frontend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }
    }
